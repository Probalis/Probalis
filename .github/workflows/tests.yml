# Probalis : lance les tests automatiques à chaque envoi de code (intégration continue).
# Rien n'est calculé ni mis en ligne ici : c'est le rôle de build.yml.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer Probalis
        run: pip install -e ".[dev]"

      - name: Tests automatiques
        run: python -m pytest -q
