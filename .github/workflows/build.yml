# Probalis : recalcule toutes les analyses et remet le site en ligne. Rythme voulu par le porteur du projet
# (22/11/2026) : toutes les 6 heures en semaine, plus 21 h et 23 h le soir (Ligue des champions et autres coupes
# d'Europe à 18 h 45 et 21 h), toutes les heures le week-end, quand presque tous les matchs se jouent.
# Chaque lancement analyse les matchs d'aujourd'hui jusqu'à J+8 (fenêtre glissante), tient compte des résultats déjà
# connus et règle tout de suite les paris déjà gagnés ou perdus des matchs en cours (score en direct de TheSportsDB).
name: Analyses et site

on:
  schedule:
    # GitHub compte les heures en UTC. Heure du Cameroun (et de l'Afrique centrale et de l'Ouest en UTC+1) = UTC + 1.
    # La 5e minute évite l'heure pile, très chargée chez GitHub (lancements retardés). GitHub peut quand même démarrer
    # avec quelques minutes de retard, parfois plus.
    # Semaine (lundi → vendredi, heure du Cameroun) : 0 h 05, 6 h 05, 12 h 05, 18 h 05, 21 h 05 et 23 h 05.
    # Un match de 18 h 45 est fini à 21 h 05 ; un match de 21 h est fini (ou presque) à 23 h 05 : ses paris déjà
    # joués d'avance sont réglés, le reste au lancement de 0 h 05.
    - cron: "5 23 * * 0-4"              # 0 h 05 du lundi au vendredi (23 h 05 UTC, la veille)
    - cron: "5 5,11,17,20,22 * * 1-5"   # 6 h 05, 12 h 05, 18 h 05, 21 h 05 et 23 h 05 du lundi au vendredi
    # Week-end (samedi et dimanche, heure du Cameroun) : toutes les heures, de samedi 0 h 05 à dimanche 23 h 05.
    - cron: "5 23 * * 5"          # samedi 0 h 05 (vendredi 23 h 05 UTC)
    - cron: "5 * * * 6"           # samedi 1 h 05 → dimanche 0 h 05
    - cron: "5 0-22 * * 0"        # dimanche 1 h 05 → 23 h 05
    # Coût : 78 lancements par semaine (30 en semaine, 48 le week-end), 1 à 4 minutes chacun avec les données gardées.
    # Gratuit et sans limite tant que le dépôt est public ; même en privé, environ 340 lancements par mois (1 à 4 min)
    # resteraient en général sous les 2 000 minutes gratuites. Cloudflare Pages : environ 340 mises en ligne par mois
    # (limite gratuite : 500).
  workflow_dispatch:        # bouton « Run workflow » pour relancer à la main

concurrency:
  group: analyses
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75     # le tout premier lancement (cache vide) a duré 55 minutes ; les suivants sont bien plus courts
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"   # messages du calcul affichés en direct dans l'onglet Actions
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Réglages publics du site (variables GitHub, voir docs/06-comptes-premium-emails.md).
      # Tant qu'ils sont vides, le site tourne en « mode démo » (connexion et Premium simulés).
      PROBALIS_SITE_URL: ${{ vars.PROBALIS_SITE_URL }}
      PROBALIS_SUPABASE_URL: ${{ vars.PROBALIS_SUPABASE_URL }}
      PROBALIS_SUPABASE_ANON_KEY: ${{ vars.PROBALIS_SUPABASE_ANON_KEY }}
      PROBALIS_CONTACT_EMAIL: ${{ vars.PROBALIS_CONTACT_EMAIL }}
      PROBALIS_OWNER_NAME: ${{ vars.PROBALIS_OWNER_NAME }}
      # Clé de la copie complète chiffrée de l'historique (/data/history-full.bin). Sans elle, le calcul s'arrête
      # au lieu de republier un historique amputé (voir probalis/site/history.py).
      PROBALIS_HISTORY_KEY: ${{ secrets.PROBALIS_HISTORY_KEY }}
      # Clé gratuite de The Odds API (cotes des coupes d'Europe, de la Ligue des champions féminine, de la
      # Frauen-Bundesliga et de la Ligue saoudienne, voir probalis/football/oddsapi.py). Sans elle, ces matchs
      # restent calculés par le modèle seul.
      PROBALIS_ODDS_API_KEY: ${{ secrets.PROBALIS_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer Probalis
        run: pip install -e ".[dev]"

      # Si un test échoue, rien n'est calculé ni mis en ligne : l'ancien site reste en ligne.
      - name: Tests automatiques
        run: python -m pytest -q

      - name: Reprendre les données déjà téléchargées
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: donnees-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: donnees-

      - name: Calculer les analyses et générer le site
        run: python -m probalis build

      - name: Garder les données pour le prochain lancement
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: donnees-${{ github.run_id }}-${{ github.run_attempt }}

      # Seulement si les secrets Cloudflare sont enregistrés (voir docs/03-sources-gratuites.md, partie 4).
      # Si le calcul a échoué, ces étapes ne s'exécutent pas : l'ancien site reste en ligne.
      - name: Créer le projet Cloudflare Pages (lancement à la main ; sans effet s'il existe déjà)
        if: github.event_name == 'workflow_dispatch' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PROJECT || 'probalis' }} --production-branch=main

      - name: Mettre le site en ligne (Cloudflare Pages)
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT || 'probalis' }} --branch=main
